          minimum: 1
        room_type:
          allOf:
          - $ref: '#/components/schemas/RoomType'
          readOnly: true
        room_type_id:
          type: integer
          writeOnly: true
        condition:
          $ref: '#/components/schemas/ConditionEnum'
        condition_label:
          type: string
          readOnly: true
        display_status:
          type: string
          readOnly: true
        notes:
          type: string
          maxLength: 300
        is_active:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedRoomType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 300
        capacity:
          type: integer
          maximum: 32767
          minimum: 1
        base_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
    PatchedServiceItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        unit:
          $ref: '#/components/schemas/UnitEnum'
        unit_valid:
          type: boolean
          readOnly: true
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
        is_active:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true
    RefreshResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    Reschedule:
      type: object
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        room_id:
          type: integer
        expected_nightly_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
      required:
      - end_date
      - start_date
    RoleEnum:
      enum:
      - admin
      - receptionist
      - manager
      type: string
      description: |-
        * `admin` - Quản trị viên
        * `receptionist` - Lễ tân
        * `manager` - Quản lý
    Room:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          pattern: ^[A-Za-z0-9-]+$
          maxLength: 10
        floor:
          type: integer
          maximum: 32767
          minimum: 1
        room_type:
          allOf:
          - $ref: '#/components/schemas/RoomType'
          readOnly: true
        room_type_id:
          type: integer
          writeOnly: true
        condition:
          $ref: '#/components/schemas/ConditionEnum'
        condition_label:
          type: string
          readOnly: true
        display_status:
          type: string
          readOnly: true
        notes:
          type: string
          maxLength: 300
        is_active:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - condition_label
      - display_status
      - floor
      - id
      - number
      - room_type
      - room_type_id
      - updated_at
    RoomCondition:
      type: object
      properties:
        condition:
          $ref: '#/components/schemas/ConditionEnum'
      required:
      - condition
    RoomType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 300
        capacity:
          type: integer
          maximum: 32767
          minimum: 1
        base_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
      required:
      - base_rate
      - capacity
      - id
      - name
    ServiceItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        unit:
          $ref: '#/components/schemas/UnitEnum'
        unit_valid:
          type: boolean
          readOnly: true
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
        is_active:
          type: boolean
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - name
      - unit
      - unit_price
      - unit_valid
      - updated_at
    ServiceUnit:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
        example:
          type: string
      required:
      - example
      - label
      - value
    ServiceUnits:
      type: object
      properties:
        units:
          type: array
          items:
            $ref: '#/components/schemas/ServiceUnit'
      required:
      - units
    ServiceUsage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        service_id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        unit:
          type: string
          readOnly: true
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,0})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ServiceUsageStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          readOnly: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_by:
          type: string
          readOnly: true
          nullable: true
        cancel_reason:
          type: string
          readOnly: true
      required:
      - cancel_reason
      - cancelled_at
      - cancelled_by
      - created_at
      - created_by
      - id
      - name
      - quantity
      - service_id
      - status
      - total
      - unit
      - unit_price
    ServiceUsageStatusEnum:
      enum:
      - active
      - cancelled
