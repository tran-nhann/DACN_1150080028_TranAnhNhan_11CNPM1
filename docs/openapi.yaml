          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: bookings_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      tags:
      - bookings
      requestBody:
