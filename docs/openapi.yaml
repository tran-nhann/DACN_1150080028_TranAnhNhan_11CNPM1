components:
  schemas:
    ActiveUserRefresh:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    AddService:
      type: object
      properties:
        service_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        quantity:
          type: integer
          maximum: 999
          minimum: 1
        expected_unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
      required:
      - expected_unit_price
      - quantity
      - service_id
    BedTypeEnum:
      enum:
      - single
      - double
      - queen
      - king
      - twin
      - mixed
      type: string
      description: |-
        * `single` - Giường đơn
        * `double` - Giường đôi
        * `queen` - Giường Queen
        * `king` - Giường King
        * `twin` - Hai giường đơn
        * `mixed` - Kết hợp nhiều loại giường
    BlankEnum:
      enum:
      - ''
    Booking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
        room:
          allOf:
          - $ref: '#/components/schemas/Room'
          readOnly: true
        customer:
          allOf:
          - $ref: '#/components/schemas/BookingCustomer'
          readOnly: true
        start_date:
          type: string
          format: date
          readOnly: true
        end_date:
          type: string
          format: date
          readOnly: true
        guests:
          type: integer
          readOnly: true
        nightly_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
        room_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,0})?$
          readOnly: true
        planned_service_total:
          type: string
          readOnly: true
        service_total:
          type: string
          readOnly: true
        estimated_total:
          type: string
          readOnly: true
        nights:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        checked_in_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        check_in_record_recovered:
          type: boolean
          readOnly: true
        checked_out_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        room_segments:
          type: array
          items:
            $ref: '#/components/schemas/RoomSegment'
          readOnly: true
        room_moves:
          type: array
          items:
            $ref: '#/components/schemas/RoomMoveHistory'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - check_in_record_recovered
      - checked_in_at
      - checked_out_at
      - code
      - created_at
      - customer
      - end_date
      - estimated_total
      - guests
      - id
      - nightly_rate
      - nights
      - planned_service_total
      - room
      - room_moves
      - room_segments
      - room_total
      - service_total
      - start_date
      - status
      - status_label
    BookingCreate:
      type: object
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        services:
          type: array
          items:
            $ref: '#/components/schemas/AddService'
        room_id:
          type: integer
        customer_id:
          type: integer
        guests:
          type: integer
          maximum: 20
          minimum: 1
        expected_nightly_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
      required:
      - customer_id
      - end_date
      - guests
      - room_id
      - start_date
    BookingCustomer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 100
      required:
      - full_name
      - id
    BookingServicePlan:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        service_id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        unit:
          type: string
          readOnly: true
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,0})?$
          readOnly: true
        status:
          type: string
          readOnly: true
          description: active/cancelled cho phát sinh; reserved/posted/cancelled cho
            đặt kèm.
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          readOnly: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_by:
          type: string
          readOnly: true
          nullable: true
        cancel_reason:
          type: string
          readOnly: true
        planned:
          type: boolean
          readOnly: true
          default: true
      required:
      - cancel_reason
      - cancelled_at
      - cancelled_by
      - created_at
      - created_by
      - id
      - name
      - planned
      - quantity
      - service_id
      - status
      - total
      - unit
      - unit_price
    CancelService:
      type: object
      properties:
        reason:
          type: string
          maxLength: 200
      required:
      - reason
    CategoryEnum:
      enum:
      - food
      - laundry
      - transport
      - minibar
      - wellness
      - other
      type: string
      description: |-
        * `food` - Ăn uống
        * `laundry` - Giặt ủi
        * `transport` - Đưa đón
        * `minibar` - Minibar
        * `wellness` - Thư giãn
        * `other` - Khác
    Checkout:
      type: object
      properties:
        quote_token:
          type: string
          pattern: ^[a-f0-9]{64}$
        expected_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,0})?$
        method:
          $ref: '#/components/schemas/MethodEnum'
        payment_received:
          type: boolean
        reference:
          type: string
          default: ''
          maxLength: 100
        notes:
          type: string
          default: ''
          maxLength: 300
      required:
      - expected_total
      - method
      - payment_received
      - quote_token
    CheckoutResponse:
      type: object
      properties:
        invoice:
          $ref: '#/components/schemas/Invoice'
        booking:
          $ref: '#/components/schemas/Booking'
      required:
      - booking
      - invoice
    CleanRoom:
      type: object
      properties:
        expected_updated_at:
          type: string
          format: date-time
      required:
      - expected_updated_at
    ConditionEnum:
      enum:
      - ready
      - cleaning
      - maintenance
      type: string
      description: |-
        * `ready` - Sẵn sàng
        * `cleaning` - Cần dọn
        * `maintenance` - Bảo trì
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 100
        phone:
          type: string
          pattern: ^\+?[0-9]{9,15}$
          maxLength: 20
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        notes:
          type: string
          maxLength: 300
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - full_name
      - id
      - phone
    Extend:
      type: object
      properties:
        end_date:
          type: string
          format: date
      required:
      - end_date
    Folio:
      type: object
      properties:
        booking_id:
          type: integer
        booking_code:
          type: string
        guest_name:
          type: string
        guest_phone:
          type: string
        room_number:
          type: string
        room_type:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        nights:
          type: integer
        room_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,0})?$
        service_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,0})?$
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,0})?$
        currency:
          type: string
        can_checkout:
          type: boolean
        blocked_reason:
          type: string
        billing_policy:
          type: string
        quote_token:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/FolioLine'
      required:
      - billing_policy
      - blocked_reason
      - booking_code
      - booking_id
      - can_checkout
      - currency
