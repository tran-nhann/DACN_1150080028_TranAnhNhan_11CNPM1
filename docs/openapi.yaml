                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/service-units/:
    get:
      operationId: service_units_retrieve
      tags:
      - service-units
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnits'
          description: ''
  /api/v1/services/:
    get:
      operationId: services_list
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
        description: Lọc dịch vụ đang bán/ngừng bán.
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - services
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServiceItemList'
          description: ''
    post:
      operationId: services_create
      tags:
      - services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServiceItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServiceItem'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceItem'
          description: ''
  /api/v1/services/{id}/:
    get:
      operationId: services_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this service item.
        required: true
      tags:
      - services
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceItem'
          description: ''
    put:
      operationId: services_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this service item.
        required: true
      tags:
      - services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ServiceItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServiceItem'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceItem'
          description: ''
    patch:
      operationId: services_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this service item.
        required: true
      tags:
      - services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedServiceItem'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedServiceItem'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedServiceItem'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceItem'
          description: ''
components:
  schemas:
    ActiveUserRefresh:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    AddService:
      type: object
      properties:
        service_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        quantity:
          type: integer
          maximum: 999
          minimum: 1
        expected_unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
      required:
      - expected_unit_price
      - quantity
      - service_id
    Booking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
        room:
          allOf:
          - $ref: '#/components/schemas/Room'
          readOnly: true
        customer:
          allOf:
          - $ref: '#/components/schemas/BookingCustomer'
          readOnly: true
        start_date:
          type: string
          format: date
          readOnly: true
        end_date:
          type: string
          format: date
          readOnly: true
        guests:
          type: integer
          readOnly: true
        nightly_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
          readOnly: true
        room_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,0})?$
          readOnly: true
        nights:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        status_label:
          type: string
          readOnly: true
        checked_in_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - checked_in_at
      - code
      - created_at
      - customer
      - end_date
      - guests
      - id
      - nightly_rate
      - nights
      - room
      - room_total
      - start_date
      - status
      - status_label
    BookingCreate:
      type: object
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        room_id:
          type: integer
        customer_id:
          type: integer
        guests:
          type: integer
          maximum: 20
          minimum: 1
        expected_nightly_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,0})?$
      required:
      - customer_id
      - end_date
      - guests
      - room_id
      - start_date
    BookingCustomer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 100
      required:
      - full_name
      - id
    BookingStatusEnum:
      enum:
      - confirmed
      - checked_in
      - checked_out
      - cancelled
      type: string
      description: |-
        * `confirmed` - Đã đặt
        * `checked_in` - Đang ở
        * `checked_out` - Đã trả
        * `cancelled` - Đã hủy
    CancelService:
      type: object
      properties:
        reason:
          type: string
          maxLength: 200
      required:
      - reason
    ConditionEnum:
      enum:
      - ready
      - cleaning
      - maintenance
      type: string
      description: |-
        * `ready` - Sẵn sàng
        * `cleaning` - Cần dọn
        * `maintenance` - Bảo trì
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 100
        phone:
          type: string
          pattern: ^\+?[0-9]{9,15}$
          maxLength: 20
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        notes:
          type: string
          maxLength: 300
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - full_name
      - id
      - phone
    Extend:
      type: object
      properties:
        end_date:
          type: string
          format: date
      required:
      - end_date
    Login:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    LoginResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - refresh
      - user
    Logout:
      type: object
      properties:
        refresh:
          type: string
      required:
      - refresh
    PaginatedBookingList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
    PaginatedCustomerList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
    PaginatedRoomList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Room'
    PaginatedRoomTypeList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/RoomType'
    PaginatedServiceItemList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ServiceItem'
    PatchedCustomer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 100
        phone:
          type: string
          pattern: ^\+?[0-9]{9,15}$
          maxLength: 20
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        notes:
          type: string
          maxLength: 300
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedRoom:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          pattern: ^[A-Za-z0-9-]+$
          maxLength: 10
        floor:
          type: integer
