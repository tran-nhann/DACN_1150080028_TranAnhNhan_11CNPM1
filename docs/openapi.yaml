          type: integer
        description: Lịch đặt của một khách hàng.
      - in: query
        name: departure_on
        schema:
          type: string
          format: date
        description: Ngày trả phòng chính xác.
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: room
        schema:
          type: integer
        description: Lịch đặt của một phòng.
      - name: search
