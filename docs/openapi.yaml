      - ly
      - bình
      - suất
      - kg
      - cái
      - bộ
      - lượt
      - giờ
      - ngày
      - đêm
      - gói
      type: string
      description: |-
        * `chai` - Chai
        * `lon` - Lon
        * `ly` - Ly
        * `bình` - Bình
        * `suất` - Suất
        * `kg` - kg
        * `cái` - Cái
        * `bộ` - Bộ
        * `lượt` - Lượt
        * `giờ` - Giờ
        * `ngày` - Ngày
        * `đêm` - Đêm
        * `gói` - Gói
    UsagePage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/ServiceUsage'
        room_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,15}(?:\.\d{0,0})?$
        service_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,0})?$
        estimated_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,18}(?:\.\d{0,0})?$
        can_edit:
          type: boolean
      required:
      - can_edit
      - count
      - estimated_total
      - next
      - previous
      - results
      - room_total
      - service_total
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Tên đăng nhập
          description: Yêu cầu. 150 ký tự hoặc ít hơn. Chỉ là chữ cái, chữ số và @/./+/-/_.
        display_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        role_label:
          type: string
          readOnly: true
      required:
      - display_name
      - id
      - role
      - role_label
      - username
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
